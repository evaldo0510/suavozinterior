    <meta name="theme-color" content="#0c0a09">
    
    <!-- SEO & Discovery -->
    <title>Inner Voice PCH | Therapeutic Cognitive Poetry & Sanctuary</title>
    <meta name="description" content="A guided inner sanctuary for mental clarity. Transform anxiety into poetic wisdom using the PCH method. Not a clinical tool, but a mirror for your voice.">
    <meta name="keywords" content="Inner Voice, PCH, Therapeutic Poetry, Cognitive Reframing, Mental Clarity, Introspective Affirmations, Anxiety Relief, Guided Reflection, Evaldo Poeta">

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Inner Voice PCH - Your Cognitive Sanctuary">
    <meta property="og:description" content="Enter your inner room of freedom. A voice-first guide for emotional organization and presence.">
    <meta property="og:image" content="/logo.svg">
    <meta property="og:url" content="https://innervoice.app">
    
    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="apple-touch-icon" href="/logo.svg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Lato:wght@300;400&display=swap');
      
      body {
        font-family: 'Lato', sans-serif;
        background-color: #0c0a09; /* stone-950 */
        color: #e7e5e4; /* stone-200 */
      }
      
      h1, h2, h3, .serif-text {
        font-family: 'Cormorant Garamond', serif;
      }

      .breathing-glow {
        animation: breathe 8s ease-in-out infinite;
      }

      /* Custom Scrollbar for Journals */
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(28, 25, 23, 0.5);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(68, 64, 60, 0.5);
        border-radius: 2px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(168, 162, 158, 0.5);
      }

      @keyframes breathe {
        0%, 100% { box-shadow: 0 0 20px 5px rgba(20, 184, 166, 0.1); }
        50% { box-shadow: 0 0 40px 15px rgba(20, 184, 166, 0.3); }
      }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered: ', registration);
            })
            .catch(registrationError => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
